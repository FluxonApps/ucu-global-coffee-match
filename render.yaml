services:
  # 1. FastAPI Backend
  - type: web
    name: coffee-match-backend
    env: python
    buildCommand: "cd backend && pip install uv && uv sync"
    startCommand: "cd backend && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    preDeployCommand: "cd backend && uv run python -m app.scripts.init_db"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coffee-match-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://coffee-match-frontend.onrender.com" # Вкажіть URL вашого фронтенду

  # 2. Slack Bot (Background Worker)
  - type: worker
    name: coffee-match-slack-bot
    env: python
    buildCommand: "pip install -r Slack_bot/requirements.txt" # або cd Slack_bot && pip install uv && uv sync
    startCommand: "python Slack_bot/slack_bot_main.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coffee-match-db
          property: connectionString
      - key: SLACK_BOT_TOKEN
        sync: false # Введете вручну в панелі Render
      - key: SLACK_APP_TOKEN
        sync: false # Введете вручну в панелі Render

  # 3. Frontend (Static Site для Vite/React)
  - type: web
    name: coffee-match-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist" # Якщо створюється папка build — замініть на frontend/build
    envVars:
      - key: VITE_API_URL
        value: "https://coffee-match-backend.onrender.com"

databases:
  # 4. PostgreSQL Database
  - name: coffee-match-db
    databaseName: coffee_db
    user: coffee_user

services:
  db:
    image: postgres:16-alpine
    container_name: coffee-match-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coffee_match
    ports:
      - "5432:5432"
    volumes:
      - coffee-match-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  coffee-match-db-data:
